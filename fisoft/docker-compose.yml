services:
  mongodb:
    image: mongo:7.0
    container_name: fisoft_mongodb
    restart: always
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_DATABASE=fiperde_core
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_ROOT_USERNAME:-root}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_ROOT_PASSWORD:-example}
    volumes:
      - mongodb_data:/data/db
      - mongodb_config:/data/configdb
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 10s

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fisoft_app
    restart: always
    ports:
      - "${APP_PORT:-8080}:8080"
    environment:
      PORT: "8080"
      NODE_ENV: "production"
      MONGODB_URI: "mongodb://mongodb:27017"
      MONGO_ROOT_USERNAME: "${MONGO_ROOT_USERNAME:-root}"
      MONGO_ROOT_PASSWORD: "${MONGO_ROOT_PASSWORD:-example}"
      FIREBASE_SERVICE_ACCOUNT_PATH: "${FIREBASE_SERVICE_ACCOUNT_PATH:-/app/firebase-service-account.json}"
      PAYTR_MERCHANT_ID: "${PAYTR_MERCHANT_ID:-test}"
      PAYTR_MERCHANT_KEY: "${PAYTR_MERCHANT_KEY:-test}"
      PAYTR_MERCHANT_SALT: "${PAYTR_MERCHANT_SALT:-test}"
      BASE_URL: "${BASE_URL:-http://localhost:8080}"
      MERCHANT_OK_URL: "${MERCHANT_OK_URL:-http://localhost:8080/success}"
      MERCHANT_FAIL_URL: "${MERCHANT_FAIL_URL:-http://localhost:8080/fail}"
    volumes:
      - ./firebase-service-account.json:/app/firebase-service-account.json:ro
    depends_on:
      mongodb:
        condition: service_healthy

volumes:
  mongodb_data:
  mongodb_config:
